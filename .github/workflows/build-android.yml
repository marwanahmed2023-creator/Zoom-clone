name: Build Convo Android APK

on:
  workflow_dispatch:
  push:
    branches: [native-apk]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install web and Capacitor dependencies
        run: npm install
      - name: Build website bundle
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Install icon renderer
        run: pip install cairosvg
      - name: Apply Convo app icon
        run: python3 native/android/install_icon.py
      - name: Add native incoming-call service
        run: |
          mkdir -p android/app/src/main/java/com/meet/app
          cp native/android/MainActivity.java android/app/src/main/java/com/meet/app/MainActivity.java
          cp native/android/IncomingCallActivity.java android/app/src/main/java/com/meet/app/IncomingCallActivity.java
          cp native/android/NativeCallListenerPlugin.java android/app/src/main/java/com/meet/app/NativeCallListenerPlugin.java
          cp native/android/CallListenerService.java android/app/src/main/java/com/meet/app/CallListenerService.java
          python3 native/android/patch_manifest.py
      - name: Generate bundled ringtone
        run: python3 native/android/create_ringtone.py
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Convo-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
