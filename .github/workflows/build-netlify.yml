name: Build website for Netlify

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Save deploy folder
        uses: actions/upload-artifact@v4
        with:
          name: netlify-dist
          path: dist/
          if-no-files-found: error
